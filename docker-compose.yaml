services:
  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.api
      target: dev
    volumes:
      - ./backend:/build
    # secrets come from backend/.env; listing them under `environment` would set
    # them to the empty string, which godotenv then refuses to override
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://spotiarch:spotiarch@postgres:5432/spotiarch?sslmode=disable
      REDIS_URL: redis://redis:6379
      SECURE_COOKIES: "false"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  watcher:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile.watcher
      target: dev
    volumes:
      - ./backend:/build
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgres://spotiarch:spotiarch@postgres:5432/spotiarch?sslmode=disable
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # proxy target for the Vite dev server; the browser only ever calls /api
      VITE_API_URL: http://api:8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5173/"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spotiarch
      POSTGRES_PASSWORD: spotiarch
      POSTGRES_DB: spotiarch
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spotiarch -d spotiarch"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
