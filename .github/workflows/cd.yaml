name: CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      backend_built: ${{ steps.changes.outputs.backend }}
      frontend_built: ${{ steps.changes.outputs.frontend }}
      tag: ${{ github.event.workflow_run.head_sha }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed components
        id: changes
        shell: bash
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          BACKEND_BEFORE=$(grep -A2 'name: ghcr.io/chivta/spotiarch/api' k8s/kustomization.yaml | grep -oP '(?<=newTag: )\S+' || true)
          FRONTEND_BEFORE=$(grep -A2 'name: ghcr.io/chivta/spotiarch/frontend' k8s/kustomization.yaml | grep -oP '(?<=newTag: )\S+' || true)

          backend=false
          frontend=false

          if ! git cat-file -e "${BACKEND_BEFORE}^{commit}" 2>/dev/null; then
            backend=true
          elif git diff --name-only "$BACKEND_BEFORE" "$SHA" | grep -q '^backend/'; then
            backend=true
          fi

          if ! git cat-file -e "${FRONTEND_BEFORE}^{commit}" 2>/dev/null; then
            frontend=true
          elif git diff --name-only "$FRONTEND_BEFORE" "$SHA" | grep -q '^frontend/'; then
            frontend=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - name: Build and push api
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.api
          push: true
          tags: |
            ghcr.io/chivta/spotiarch/api:latest
            ghcr.io/chivta/spotiarch/api:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build and push watcher
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.watcher
          push: true
          tags: |
            ghcr.io/chivta/spotiarch/watcher:latest
            ghcr.io/chivta/spotiarch/watcher:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=watcher
          cache-to: type=gha,scope=watcher,mode=max

      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/chivta/spotiarch/frontend:latest
            ghcr.io/chivta/spotiarch/frontend:${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  deploy:
    needs: build-and-push
    if: ${{ needs.build-and-push.outputs.backend_built == 'true' || needs.build-and-push.outputs.frontend_built == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update image tags
        working-directory: ./k8s
        run: |
          if [ "${{ needs.build-and-push.outputs.backend_built }}" = "true" ]; then
            kustomize edit set image \
              ghcr.io/chivta/spotiarch/api=ghcr.io/chivta/spotiarch/api:${{ needs.build-and-push.outputs.tag }}
            kustomize edit set image \
              ghcr.io/chivta/spotiarch/watcher=ghcr.io/chivta/spotiarch/watcher:${{ needs.build-and-push.outputs.tag }}
          fi
          if [ "${{ needs.build-and-push.outputs.frontend_built }}" = "true" ]; then
            kustomize edit set image \
              ghcr.io/chivta/spotiarch/frontend=ghcr.io/chivta/spotiarch/frontend:${{ needs.build-and-push.outputs.tag }}
          fi

      - name: Commit manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/kustomization.yaml
          git commit -m "deploy: update images to ${{ needs.build-and-push.outputs.tag }}"
          git push origin HEAD:main
